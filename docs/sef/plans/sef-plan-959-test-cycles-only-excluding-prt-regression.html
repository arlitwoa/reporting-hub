    "PDE-4599": "Non-Integrated Parallel Testing is a payroll assurance phase where payroll is run in a standalone Datapay environment without live upstream or downstream integrations. Its purpose is to prove that core payroll processing works correctly on its own: employee setup, leave setup, pay data processing, pay run execution, and variance checking. In practice, this means loading full employee data (including leave balances and 52-week earnings), running payroll in parallel with the current payroll process, and comparing outcomes to confirm gross-to-net calculations, deductions, statutory obligations, and overall payroll accuracy.\n\nNIP Testing is critical because it isolates payroll behavior from integration noise and exposes calculation, configuration, and data quality issues early. It gives the programme a controlled way to validate compliance and identify defects before integrated testing and production deployment. By documenting and triaging variances in partnership between Datapay and payroll stakeholders, NIP creates confidence that payroll outputs are accurate for all employee groups and that the system is ready to progress into end-to-end integration and go-live stages.\n\nThe programme will encourage SMEs to use the NIP environment once the variations have been resolved - this will give the business an early opportunity to interact with the new system and to execute BAU processes.",
    "PDE-4604": "The E2E Test Phase validates critical business scenarios across the integrated landscape, beginning only after connectivity testing has confirmed secure and reliable data exchange across all in-scope interfaces. Connectivity execution is expected to reuse available lower-tier environments, including downstream TWoA systems that only provide dev or test instances. Following connectivity, a stabilization phase will be run to resolve high-impact defects, harden interface reliability, and improve test-data consistency before scaling SME and Business User execution.\n\nE2E then focuses on end-to-end process assurance with significant SME and Business User participation, validating real business flows, role-based execution, and cross-system outcomes with production-like migrated data. Responsibilities are partitioned by integration path: KPMG and Datacom lead Workday-to-Datapay testing, KPMG leads Workday-to-AIS testing, and TWoA leads AIS downstream testing and downstream business-flow validation. TWoA retains overall governance accountability for E2E, including entry/exit control, defect triage oversight, evidence quality, and go-forward readiness recommendations.\n\nTo align strategy with this approach, downstream E2E validation for TWoA-owned systems should be explicitly moved from exclusions into scope, with named interfaces and clear ownership.\n\nThis phase will require high levels of coordination and cooperation to ensure all tests are covered.",
    "PDE-4606": "",
    "PDE-4607": "",
    "PDE-4608": "User Acceptance Testing (UAT) is the business-led phase where TWoA validates that the delivered solution is fit for operational use, supports intended business outcomes, and is acceptable for go-live. In this phase, business representatives execute formal and informal tests from a user perspective across in-scope processes, roles, and controls, using production-like migrated data in an integrated environment. UAT confirms that configured processes, integrations, and role-based access operate as expected in real-world scenarios, with evidence captured for traceability and decision-making.\n\nUAT is owned by TWoA, with KPMG providing support for planning, execution coordination, defect handling, and issue resolution triage. Execution is governed through defined entry and exit criteria, structured reporting, and phase gate reviews to ensure readiness and risk are transparent. Defects are managed through the programme defect process, with business impact and testing impact used to prioritise remediation, and closure based on retest evidence against agreed design. The outcome of UAT is a clear business acceptance position, including any agreed residual risks and conditions for progression toward production readiness.\n\nCould the programme team please confirm the intended UAT boundary for Phase 1, specifically whether UAT is expected to be limited to Workday and nearest-neighbour validation, or whether it explicitly includes end-to-end validation into TWoA downstream systems? The current strategy appears to position downstream system testing as out of scope at programme level, while also stating that UAT is business-led and may include steps in third-party environments. To avoid ambiguity in planning, resourcing, and entry/exit criteria, we need a clear decision on the target UAT scope, including which downstream interfaces are in scope, which are excluded, and who owns execution and sign-off for each path. Which option:\n\n1. UAT scope option A: Workday plus nearest-neighbour only, with downstream validation excluded.\n2. UAT scope option B: Workday plus defined TWoA downstream systems, with named ownership and sign-off.\n\nPlease confirm the selected option and the in-scope interface list so we can align the UAT plan, governance gates, and delivery dates.",
    "PDE-4616": "Parallel Run covers the controlled comparison of payroll outcomes between the legacy payroll process and the new Workday-to-Datapay process for the same pay periods, using representative employee data and real pay scenarios. Its purpose is to confirm that the new solution produces accurate and compliant results before go-live by reconciling gross-to-net outcomes, deductions, PAYE/KiwiSaver, leave balances and entitlements, and other statutory calculations. It also covers investigation and triage of variances, confirmation of data quality and mapping assumptions, and evidence-based sign-off that any differences are either resolved or formally accepted.\n\nIn practical terms, the phase includes execution of parallel pay runs, variance reporting and analysis, defect/workaround management, and readiness confirmation for production payroll operation. It does not replace broader business process acceptance; rather, it is the payroll assurance gate focused on payroll accuracy, control, and operational confidence for cutover.",
    "PDE-4677": "System Integration Testing (SIT) is the phase used to prove point-to-point integration behaviour and data exchange correctness between Workday and connected systems, including payroll pathways. The phase begins with mandatory connectivity testing to confirm interface availability, transport security, encryption/decryption, and operational file movement before scenario execution starts.\n\nOnce connectivity is confirmed, SIT validates inbound and outbound interface processing across agreed integrations. This includes schema and payload conformance, field-level mapping, transformation accuracy, and source-to-target data integrity. It also covers negative-path behaviour, including error handling, retries, reprocessing controls, and operational supportability, with evidence captured to show that transferred data remains consistent across participating applications.\n\nDelivery responsibilities in this phase are explicitly partitioned: KPMG and Datacom jointly execute Workday-to-Datapay testing, KPMG executes Workday-to-AIS testing, and TWoA executes AIS downstream testing. Across all streams, TWoA retains overall accountability for SIT governance and oversight, including test planning, execution control, traceability, defect triage governance, and phase-level quality reporting.\n\nSIT is therefore the integration assurance gate that establishes confidence in interface reliability and data correctness, while deliberately excluding full cross-process business validation and business acceptance. End-to-end business orchestration is validated in E2E, and business acceptance is validated in UAT. SIT evidence is used to support readiness decisions and risk-based progression into those subsequent phases.",

    "PDE-4921": "The Integration phase validates that all in-scope interfaces are technically connected, secure, and able to exchange data reliably before broader scenario-based System Integration Testing begins. The primary objective is to prove interface readiness end-to-end at the transport and payload level, including connectivity, authentication, encryption/decryption, file movement, API/service invocation, scheduling, acknowledgements, and error handling.\n\nThis phase is intentionally focused on interface operability rather than full business-process coverage. It establishes confidence that integration pathways are stable, observable, and supportable in the target environment, so that downstream SIT and E2E execution can proceed with reduced technical risk. Defects and issues are managed in Xray on KPMG Jira, aligned to KPMG\u2019s defect lifecycle, severity/priority model, triage cadence, and evidence-based closure approach."

    "PDE-4921": {"Elapsed Days": "75.0", "Work Days": "54.0", "Weeks": "11.0"}
    };
    const DESCRIPTION_FALLBACK = "No Description is currently entered in Jira for this item.";

    function toDate(v) {
      return new Date(`${v}T00:00:00`);
    }

    function lightenHex(hex, amount = 0.28) {
      const clean = String(hex || "").replace("#", "");
      if (!/^[0-9a-fA-F]{6}$/.test(clean)) {
        return hex;
      }
      const n = parseInt(clean, 16);
      const r = (n >> 16) & 255;
      const g = (n >> 8) & 255;
      const b = n & 255;
      const lr = Math.round(r + (255 - r) * amount);
      const lg = Math.round(g + (255 - g) * amount);
      const lb = Math.round(b + (255 - b) * amount);
      return `#${((1 << 24) + (lr << 16) + (lg << 8) + lb).toString(16).slice(1)}`;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getHoverCard() {
      return document.getElementById("hoverCard");
    }

    function formatDateLong(date) {
      const d = String(date.getDate()).padStart(2, "0");
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${d} ${monthNames[date.getMonth()]} ${date.getFullYear()}`;
    }

    function buildTimelineTooltipHtml(title, value) {
      return `
        <div class="title">${escapeHtml(title)}</div>
        <div class="meta">${escapeHtml(value)}</div>
      `;
    }

    function formatDescriptionHtml(text) {
      const safe = escapeHtml(String(text || "")).trim();
      if (!safe) {
        return "";
      }
      const normalized = safe.replace(/\r\n/g, "\n");
      const blocks = normalized
        .split(/\n\s*\n/)
        .map((b) => b.trim())
        .filter(Boolean);
      if (!blocks.length) {
        return `<p class="desc-body desc-paragraph">${safe}</p>`;
      }
      return blocks
        .map((block) => `<p class="desc-body desc-paragraph">${block.replace(/\n/g, "<br>")}</p>`)
        .join("");
    }

    function buildTooltipHtml(task, stripText) {
      const category = CATEGORY_LABELS[task.category] || task.category;
      const jiraDescription = ISSUE_DESCRIPTIONS[task.key] || "";
      const description = jiraDescription && String(jiraDescription).trim()
        ? jiraDescription
        : DESCRIPTION_FALLBACK;
      const descriptionHtml = formatDescriptionHtml(description);
      const meta = {
        ...(ISSUE_METADATA[task.key] || {}),
        ...(ISSUE_METRICS[task.key] || {}),
      };
      if (!String(meta["Test Types"] || "").trim()) {
        meta["Test Types"] = CATEGORY_LABELS[task.category] || task.category;
      }
      const fieldsHtml = ISSUE_CONTEXT_FIELDS
        .map((label) => {
          const value = (meta[label] || "").trim();
          if (!value) {
            return "";
          }
          return `<div class="field-row"><div class="field-label">${escapeHtml(label)}</div><div class="field-value">${escapeHtml(value)}</div></div>`;
        })
        .filter(Boolean)
        .join("");
      const contextSection = fieldsHtml ? `<div class="field-grid">${fieldsHtml}</div>` : "";
      return `
        <div class="title">${escapeHtml(task.key)} | ${escapeHtml(task.title)}</div>
        <div class="meta">${escapeHtml(task.start)} to ${escapeHtml(task.end)} | ${escapeHtml(category)}${stripText ? ` | ${escapeHtml(stripText)}` : ""}</div>
        ${contextSection}
        <div><span class="desc-label">Description:</span>${descriptionHtml}</div>
      `;
    }

    function showTooltip(event, html) {
      const tooltip = getHoverCard();
      if (!tooltip) {
        return;
      }
      tooltip.innerHTML = html;
      tooltip.style.display = "block";
      moveTooltip(event);
    }

    function moveTooltip(event) {
      const tooltip = getHoverCard();
      if (!tooltip || tooltip.style.display === "none") {
        return;
      }
      const pad = 14;
      let x = event.clientX + pad;
      let y = event.clientY + pad;
      const maxX = window.innerWidth - tooltip.offsetWidth - 8;
      const maxY = window.innerHeight - tooltip.offsetHeight - 8;
      if (x > maxX) {
        x = event.clientX - tooltip.offsetWidth - pad;
      }
      if (y > maxY) {
        y = event.clientY - tooltip.offsetHeight - pad;
      }
      tooltip.style.left = `${Math.max(8, x)}px`;
      tooltip.style.top = `${Math.max(8, y)}px`;
    }

    function hideTooltip() {
      const tooltip = getHoverCard();
      if (!tooltip) {
        return;
      }
      tooltip.style.display = "none";
    }

    function renderStamp() {
      const el = document.getElementById("renderStamp");
      if (!el) {
        return;
      }
      el.textContent = RENDERED_AT;
    }

    function getVisibleTaskKeysByFilter() {
      const visibleKeys = new Set(
        TASKS.filter((t) => selectedCategories.has(t.category)).map((t) => t.key)
      );

      // Ensure predecessor tasks stay visible when their dependent target is selected.
      let changed = true;
      while (changed) {
        changed = false;
        DEPENDENCIES.forEach((d) => {
          if (visibleKeys.has(d.to) && !visibleKeys.has(d.from)) {
            visibleKeys.add(d.from);
            changed = true;
          }
        });
      }

      // Keep parent rows visible when any child row is in scope.
      changed = true;
      while (changed) {
        changed = false;
        TASKS.forEach((t) => {
          if (visibleKeys.has(t.key) && t.parent && !visibleKeys.has(t.parent)) {
            visibleKeys.add(t.parent);
            changed = true;
          }
        });
      }

      return visibleKeys;
    }

    function getVisibleTasks() {
      const visibleKeys = getVisibleTaskKeysByFilter();
      const taskByKey = TASKS.reduce((acc, t) => {
        acc[t.key] = t;
        return acc;
      }, {});
      const childrenByParent = TASKS.reduce((acc, t) => {
        if (t.parent) {
          if (!acc[t.parent]) {
            acc[t.parent] = [];
          }
          acc[t.parent].push(t);
        }
        return acc;
      }, {});

      const ordered = [];
      const pushed = new Set();

      const pushTaskTree = (task) => {
        if (!task || pushed.has(task.key) || !visibleKeys.has(task.key)) {
          return;
        }
        pushed.add(task.key);
        ordered.push(task);
        if (collapsedParents.has(task.key)) {
          return;
        }
        (childrenByParent[task.key] || []).forEach((child) => {
          pushTaskTree(child);
        });
      };

      // Render roots first, then any remaining visible orphans.
      TASKS.forEach((t) => {
        if (!t.parent || !taskByKey[t.parent]) {
          pushTaskTree(t);
        }
      });
      TASKS.forEach((t) => {
        if (t.parent && taskByKey[t.parent]) {
          return;
        }
        pushTaskTree(t);
      });

      return ordered;
    }

    function renderLegendFilters() {
      const mount = document.getElementById("legendFilters");
      if (!mount) {
        return;
      }
      mount.innerHTML = "";

      CATEGORY_ORDER.forEach((cat) => {
        const style = CATEGORY_STYLES[cat] || { fill: "#dfe1e6", stroke: "#b3bac5" };
        const active = selectedCategories.has(cat);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `legend-filter${active ? "" : " inactive"}`;
        btn.title = `${active ? "Hide" : "Show"} ${CATEGORY_LABELS[cat] || cat}`;
        btn.innerHTML = `<span class="swatch" style="background:${style.fill};border-color:${style.stroke};"></span>${CATEGORY_LABELS[cat] || cat}`;
        btn.addEventListener("click", () => {
          const allSelected = selectedCategories.size === CATEGORY_ORDER.length;
          if (allSelected && selectedCategories.has(cat)) {
            selectedCategories.clear();
            selectedCategories.add(cat);
            renderAll();
            return;
          }
          if (selectedCategories.has(cat)) {
            selectedCategories.delete(cat);
          } else {
            selectedCategories.add(cat);
          }
          renderAll();
        });
        mount.appendChild(btn);
      });

      const resetBtn = document.createElement("button");
      resetBtn.type = "button";
      resetBtn.className = "legend-filter reset";
      resetBtn.textContent = "Reset Filters";
      resetBtn.title = "Show all test types";
      resetBtn.disabled = selectedCategories.size === CATEGORY_ORDER.length;
      resetBtn.addEventListener("click", () => {
        selectedCategories.clear();
        CATEGORY_ORDER.forEach((cat) => selectedCategories.add(cat));
        renderAll();
      });
      mount.appendChild(resetBtn);
    }

    function renderParentControls() {
      const mount = document.getElementById("parentControls");
      if (!mount) {
        return;
      }
      mount.innerHTML = "";
      const hasChildGroups = parentsWithChildren.length > 0;

      const collapseAll = document.createElement("button");
      collapseAll.type = "button";
      collapseAll.className = "parent-toggle global";
      collapseAll.textContent = hasChildGroups ? "Collapse All" : "Collapse All (no child groups)";
      collapseAll.title = hasChildGroups ? "Collapse children for all parents" : "No parent-child groups are available in this view";
      collapseAll.disabled = !hasChildGroups;
      collapseAll.addEventListener("click", () => {
        if (!hasChildGroups) {
          return;
        }
        parentsWithChildren.forEach((p) => collapsedParents.add(p.key));
        renderAll();
      });
      mount.appendChild(collapseAll);

      const expandAll = document.createElement("button");
      expandAll.type = "button";
      expandAll.className = "parent-toggle global";
      expandAll.textContent = hasChildGroups ? "Expand All" : "Expand All (no child groups)";
      expandAll.title = hasChildGroups ? "Expand children for all parents" : "No parent-child groups are available in this view";
      expandAll.disabled = !hasChildGroups;
      expandAll.addEventListener("click", () => {
        if (!hasChildGroups) {
          return;
        }
        collapsedParents.clear();
        renderAll();
      });
      mount.appendChild(expandAll);

      parentsWithChildren.forEach((p) => {
        const isCollapsed = collapsedParents.has(p.key);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `parent-toggle${isCollapsed ? " collapsed" : ""}`;
        btn.textContent = `${isCollapsed ? "▸" : "▾"} ${p.key} (${childCountByParent[p.key]})`;
        btn.title = `${isCollapsed ? "Expand" : "Collapse"} children for ${p.key}`;
        btn.addEventListener("click", () => {
          if (collapsedParents.has(p.key)) {
            collapsedParents.delete(p.key);
          } else {
            collapsedParents.add(p.key);
          }
          renderAll();
        });
        mount.appendChild(btn);
      });
    }

    function renderCustomGantt() {
      const mount = document.getElementById("ganttMount");
      if (!mount) {
        return;
      }
      mount.innerHTML = "";

      const tasks = getVisibleTasks();
      if (!tasks.length) {
        return;
      }
      const minDate = new Date(Math.min(...tasks.map((t) => toDate(t.start).getTime())));
      const maxDate = new Date(Math.max(...tasks.map((t) => toDate(t.end).getTime())));
      const dayMs = 24 * 60 * 60 * 1000;
      const totalDays = Math.max(1, Math.round((maxDate - minDate) / dayMs) + 1);

      const rowH = 28;
      const rowGap = 8;
      const plotW = 1180;
      const left = 40;
      const top = 24;
      const bottom = 56;
      const width = left + plotW + 20;
      const height = top + tasks.length * (rowH + rowGap) + bottom;

      const svgns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgns, "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("class", "gantt-svg");

      const defs = document.createElementNS(svgns, "defs");
      const markerPre = document.createElementNS(svgns, "marker");
      markerPre.setAttribute("id", "arrow-pre");
      markerPre.setAttribute("viewBox", "0 0 10 10");
      markerPre.setAttribute("refX", "9");
      markerPre.setAttribute("refY", "5");
      markerPre.setAttribute("markerWidth", "6");
      markerPre.setAttribute("markerHeight", "6");
      markerPre.setAttribute("orient", "auto-start-reverse");
      const markerPrePath = document.createElementNS(svgns, "path");
      markerPrePath.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
      markerPrePath.setAttribute("fill", "#5e6c84");
      markerPre.appendChild(markerPrePath);
      defs.appendChild(markerPre);

      svg.appendChild(defs);

      const addHoverOnlyInteractivity = (node, tooltipHtml) => {
        node.style.cursor = "help";
        node.addEventListener("mouseenter", (event) => {
          showTooltip(event, tooltipHtml);
        });
        node.addEventListener("mousemove", (event) => {
          moveTooltip(event);
        });
        node.addEventListener("mouseleave", () => {
          hideTooltip();
        });
      };

      // Grid month lines
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      let d = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
      if (d < minDate) {
        d = new Date(minDate.getFullYear(), minDate.getMonth() + 1, 1);
      }
      while (d <= maxDate) {
        const offsetDays = Math.round((d - minDate) / dayMs);
        const x = left + (offsetDays / totalDays) * plotW;

        const line = document.createElementNS(svgns, "line");
        line.setAttribute("x1", `${x}`);
        line.setAttribute("x2", `${x}`);
        line.setAttribute("y1", `${top}`);
        line.setAttribute("y2", `${height - bottom}`);
        line.setAttribute("stroke", "#dfe1e6");
        line.setAttribute("stroke-width", "1");
        svg.appendChild(line);
        const monthTip = buildTimelineTooltipHtml("Month Start", formatDateLong(d));
        addHoverOnlyInteractivity(line, monthTip);

        const lineHit = document.createElementNS(svgns, "line");
        lineHit.setAttribute("x1", `${x}`);
        lineHit.setAttribute("x2", `${x}`);
        lineHit.setAttribute("y1", `${top}`);
        lineHit.setAttribute("y2", `${height - bottom}`);
        lineHit.setAttribute("stroke", "transparent");
        lineHit.setAttribute("stroke-width", "10");
        addHoverOnlyInteractivity(lineHit, monthTip);
        svg.appendChild(lineHit);

        const txt = document.createElementNS(svgns, "text");
        txt.setAttribute("x", `${x + 4}`);
        txt.setAttribute("y", `${height - 8}`);
        txt.setAttribute("font-size", "11");
        txt.setAttribute("fill", "#6b778c");
        txt.textContent = `01 ${monthNames[d.getMonth()]} ${d.getFullYear()}`;
        addHoverOnlyInteractivity(txt, monthTip);
        svg.appendChild(txt);

        d = new Date(d.getFullYear(), d.getMonth() + 1, 1);
      }

      // Start-of-week grid lines and labels (Monday).
      const weekStart = new Date(minDate);
      while (weekStart.getDay() !== 1) {
        weekStart.setDate(weekStart.getDate() + 1);
      }
      for (let w = new Date(weekStart); w <= maxDate; w.setDate(w.getDate() + 7)) {
        const offsetDays = Math.round((w - minDate) / dayMs);
        const x = left + (offsetDays / totalDays) * plotW;

        const weekLine = document.createElementNS(svgns, "line");
        weekLine.setAttribute("x1", `${x}`);
        weekLine.setAttribute("x2", `${x}`);
        weekLine.setAttribute("y1", `${top}`);
        weekLine.setAttribute("y2", `${height - bottom}`);
        weekLine.setAttribute("stroke", "#edf1f6");
        weekLine.setAttribute("stroke-width", "1");
        weekLine.setAttribute("stroke-dasharray", "3 4");
        svg.appendChild(weekLine);
        const weekTip = buildTimelineTooltipHtml("Week Start (Mon)", formatDateLong(w));
        addHoverOnlyInteractivity(weekLine, weekTip);

        const weekLineHit = document.createElementNS(svgns, "line");
        weekLineHit.setAttribute("x1", `${x}`);
        weekLineHit.setAttribute("x2", `${x}`);
        weekLineHit.setAttribute("y1", `${top}`);
        weekLineHit.setAttribute("y2", `${height - bottom}`);
        weekLineHit.setAttribute("stroke", "transparent");
        weekLineHit.setAttribute("stroke-width", "10");
        addHoverOnlyInteractivity(weekLineHit, weekTip);
        svg.appendChild(weekLineHit);

        const weekTxt = document.createElementNS(svgns, "text");
        weekTxt.setAttribute("x", `${x + 1}`);
        weekTxt.setAttribute("y", `${height - 26}`);
        weekTxt.setAttribute("font-size", "9");
        weekTxt.setAttribute("fill", "#97a0af");
        weekTxt.textContent = `${String(w.getDate()).padStart(2, "0")}${String(w.getMonth() + 1).padStart(2, "0")}`;
        addHoverOnlyInteractivity(weekTxt, weekTip);
        svg.appendChild(weekTxt);
      }

      const barPosByKey = {};

      const getTestTypeText = (task) => {
        const raw = String((ISSUE_METADATA[task.key] || {})["Test Types"] || "").trim();
        if (raw) {
          return raw;
        }
        return CATEGORY_LABELS[task.category] || task.category;
      };

      const fitLabelText = (text, widthPx) => {
        if (!text) {
          return "";
        }
        // Approximate average glyph width for small SVG labels.
        const maxChars = Math.max(4, Math.floor((widthPx - 10) / 6));
        if (text.length <= maxChars) {
          return text;
        }
        return `${text.slice(0, Math.max(1, maxChars - 1)).trimEnd()}…`;
      };

      const appendBarLabel = (task, x, yBar, w, barH) => {
        if (task.category === "pre requisite") {
          return;
        }
        if (w < 56) {
          return;
        }
        const label = fitLabelText(getTestTypeText(task), w);
        if (!label) {
          return;
        }
        const txt = document.createElementNS(svgns, "text");
        txt.setAttribute("x", `${x + 6}`);
        txt.setAttribute("y", `${yBar + barH / 2}`);
        txt.setAttribute("dominant-baseline", "middle");
        txt.setAttribute("font-size", `${barH >= 22 ? 10 : 9}`);
        txt.setAttribute("font-weight", "600");
        txt.setAttribute("fill", "#172b4d");
        txt.setAttribute("paint-order", "stroke fill");
        txt.setAttribute("stroke", "#ffffff");
        txt.setAttribute("stroke-width", "2");
        txt.setAttribute("pointer-events", "none");
        txt.textContent = label;
        svg.appendChild(txt);
      };

      tasks.forEach((t, idx) => {
        const st = toDate(t.start);
        const en = toDate(t.end);
        const startDays = Math.max(0, Math.round((st - minDate) / dayMs));
        const durDays = Math.max(1, Math.round((en - st) / dayMs) + 1);
        const x = left + (startDays / totalDays) * plotW;
        const w = Math.max(8, (durDays / totalDays) * plotW);
        const y = top + idx * (rowH + rowGap);
        const isChild = Boolean(t.parent);
        const barH = isChild ? Math.max(14, Math.round(rowH * 0.66)) : rowH;
        const yBar = y + (rowH - barH) / 2;

        const style = CATEGORY_STYLES[t.category] || { fill: "#dfe1e6", stroke: "#b3bac5" };
        const barStyle = isChild
          ? { fill: lightenHex(style.fill, 0.35), stroke: lightenHex(style.stroke, 0.2) }
          : style;
        const dual = DUAL_STRIP_BY_KEY[t.key];

        const addInteractivity = (node, tooltipHtml) => {
          node.style.cursor = "pointer";
          node.addEventListener("mouseenter", (event) => {
            showTooltip(event, tooltipHtml);
          });
          node.addEventListener("mousemove", (event) => {
            moveTooltip(event);
          });
          node.addEventListener("mouseleave", () => {
            hideTooltip();
          });
          node.addEventListener("click", () => {
            window.open(`https://twoa.atlassian.net/browse/${t.key}`, "_blank", "noopener,noreferrer");
          });
        };

        if (dual) {
          const topBase = CATEGORY_STYLES[dual[0]] || barStyle;
          const bottomBase = CATEGORY_STYLES[dual[1]] || barStyle;
          const topStyle = isChild
            ? { fill: lightenHex(topBase.fill, 0.35), stroke: lightenHex(topBase.stroke, 0.2) }
            : topBase;
          const bottomStyle = isChild
            ? { fill: lightenHex(bottomBase.fill, 0.35), stroke: lightenHex(bottomBase.stroke, 0.2) }
            : bottomBase;
          const half = barH / 2;

          const topRect = document.createElementNS(svgns, "rect");
          topRect.setAttribute("x", `${x}`);
          topRect.setAttribute("y", `${yBar}`);
          topRect.setAttribute("width", `${w}`);
          topRect.setAttribute("height", `${half}`);
          topRect.setAttribute("fill", topStyle.fill);
          topRect.setAttribute("stroke", "none");
          const tooltipHtml = buildTooltipHtml(t, `Strip: ${dual[0]} + ${dual[1]}`);
          addInteractivity(topRect, tooltipHtml);
          svg.appendChild(topRect);

          const bottomRect = document.createElementNS(svgns, "rect");
          bottomRect.setAttribute("x", `${x}`);
          bottomRect.setAttribute("y", `${yBar + half}`);
          bottomRect.setAttribute("width", `${w}`);
          bottomRect.setAttribute("height", `${half}`);
          bottomRect.setAttribute("fill", bottomStyle.fill);
          bottomRect.setAttribute("stroke", "none");
          addInteractivity(bottomRect, tooltipHtml);
          svg.appendChild(bottomRect);

          const outline = document.createElementNS(svgns, "rect");
          outline.setAttribute("x", `${x}`);
          outline.setAttribute("y", `${yBar}`);
          outline.setAttribute("rx", "4");
          outline.setAttribute("ry", "4");
          outline.setAttribute("width", `${w}`);
          outline.setAttribute("height", `${barH}`);
          outline.setAttribute("fill", "none");
          outline.setAttribute("stroke", barStyle.stroke);
          outline.setAttribute("stroke-width", "1.5");
          addInteractivity(outline, tooltipHtml);
          svg.appendChild(outline);
          appendBarLabel(t, x, yBar, w, barH);
          barPosByKey[t.key] = { x, y: yBar, w, h: barH };
        } else {
          const rect = document.createElementNS(svgns, "rect");
          rect.setAttribute("x", `${x}`);
          rect.setAttribute("y", `${yBar}`);
          rect.setAttribute("rx", "4");
          rect.setAttribute("ry", "4");
          rect.setAttribute("width", `${w}`);
          rect.setAttribute("height", `${barH}`);
          rect.setAttribute("fill", barStyle.fill);
          rect.setAttribute("stroke", barStyle.stroke);
          rect.setAttribute("stroke-width", "1.5");
          addInteractivity(rect, buildTooltipHtml(t, ""));
          svg.appendChild(rect);
          appendBarLabel(t, x, yBar, w, barH);
          barPosByKey[t.key] = { x, y: yBar, w, h: barH };
        }
      });

      DEPENDENCIES.forEach((d) => {
        const from = barPosByKey[d.from];
        const to = barPosByKey[d.to];
        if (!from || !to) {
          return;
        }
        const sx = from.x + from.w;
        const sy = from.y + from.h / 2;
        const ex = to.x;
        const ey = to.y + to.h / 2;
        const dx = Math.max(30, Math.abs(ex - sx) * 0.4);

        const path = document.createElementNS(svgns, "path");
        path.setAttribute("d", `M ${sx} ${sy} C ${sx + dx} ${sy}, ${ex - dx} ${ey}, ${ex} ${ey}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", "#5e6c84");
        path.setAttribute("marker-end", "url(#arrow-pre)");
        path.setAttribute("stroke-width", "1.6");
        path.setAttribute("opacity", "0.9");
        const tt = document.createElementNS(svgns, "title");
        tt.textContent = `${d.from} -> ${d.to} (${d.kind})`;
        path.appendChild(tt);
        svg.appendChild(path);
      });

      // Today marker (draw last so it stays on top of bars/dependencies).
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      if (today >= minDate && today <= maxDate) {
        const offsetDays = Math.round((today - minDate) / dayMs);
        const x = left + (offsetDays / totalDays) * plotW;

        const todayLine = document.createElementNS(svgns, "line");
        todayLine.setAttribute("x1", `${x}`);
        todayLine.setAttribute("x2", `${x}`);
        todayLine.setAttribute("y1", `${top - 8}`);
        todayLine.setAttribute("y2", `${height - bottom}`);
        todayLine.setAttribute("stroke", "#de350b");
        todayLine.setAttribute("stroke-width", "2");
        todayLine.setAttribute("stroke-dasharray", "6 4");
        todayLine.setAttribute("opacity", "1");
        svg.appendChild(todayLine);

        const todayLabel = document.createElementNS(svgns, "text");
        todayLabel.setAttribute("x", `${x + 4}`);
        todayLabel.setAttribute("y", `${top - 6}`);
        todayLabel.setAttribute("font-size", "11");
        todayLabel.setAttribute("font-weight", "700");
        todayLabel.setAttribute("fill", "#de350b");
        todayLabel.textContent = "Today";
        svg.appendChild(todayLabel);
      }

      mount.appendChild(svg);
    }

    function renderAll() {
      renderStamp();
      renderLegendFilters();
      renderParentControls();
      renderCustomGantt();
    }

    window.addEventListener("DOMContentLoaded", renderAll);
    window.addEventListener("scroll", hideTooltip, true);
  </script>
</head>
